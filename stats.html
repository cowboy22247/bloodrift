<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>血裂隙 遊玩統計</title>
<style>:root{color-scheme:dark}body{margin:0;padding:16px;background:#0e0a0b;color:#e6dccb;font:14px/1.5 system-ui,"Noto Sans TC",sans-serif}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;color:#d9a64a;margin:22px 0 6px;border-bottom:1px solid #3a2a22;padding-bottom:4px}.k{display:flex;flex-wrap:wrap;gap:8px}.k div{background:#1a1310;border:1px solid #3a2a22;padding:8px 12px;min-width:92px}.k b{display:block;font-size:20px;color:#fff}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #2a1f1a;padding:4px 6px;text-align:left;white-space:nowrap}th{color:#b9a98f;font-weight:normal}.wrap{overflow-x:auto}.bar{display:inline-block;height:10px;background:#8e2a2a;vertical-align:middle;margin-right:4px}.fb{background:#1a1310;border-left:3px solid #d9a64a;padding:6px 10px;margin:6px 0;white-space:pre-wrap}.dim{color:#8a7a68;font-size:12px}#err{color:#ff8080}</style></head>
<body><h1>血裂隙 遊玩統計</h1><div class="dim" id="gen">載入中…</div><div id="err"></div><div id="out"></div>
<script>
const API='https://bloodrift.pages.dev/api/stats';const $=s=>document.querySelector(s);
const fmt=t=>t==null?'-':Math.floor(t/60)+':'+String(t%60).padStart(2,'0');const dt=ts=>new Date(ts*1000).toLocaleString('zh-TW',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const esc=x=>String(x==null?'':x).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const KIND={dead:'死亡',tp:'回城',win:'通關'},CLS={barb:'野蠻人',sorc:'女巫',necro:'死靈法師'},MAP={grave:'墓園',crypt:'地窖'};
const tbl=(rows,cols)=>rows&&rows.length?'<div class="wrap"><table><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[1](r))+'</td>').join('')+'</tr>').join('')+'</table></div>':'<div class="dim">還沒有資料</div>';
const STEPS=[['first_visit','第一次打開'],['title','看到標題'],['quick','按立即開始'],['town','進城鎮'],['run_start','開始一局'],['moved','開始移動'],['lvl1','第一次升級'],['t60','撐過 1 分鐘'],['t180','撐過 3 分鐘'],['boss1','打倒第一隻首領'],['t300','撐過 5 分鐘'],['result','打完一局'],['run_again','再開一局'],['t600','撐過 10 分鐘'],['gate','看到深淵之門'],['deep','選擇深入'],['chest1','開過寶箱'],['pact1','碰過契約'],['urn1','撞過罐子'],['forge','打開鐵匠'],['talent','點過天賦'],['death1','死過'],['tp_try','用過回城']];
function funnel(d){const m=Object.fromEntries((d.funnel||[]).map(x=>[x.ev,x.players]));const base=m.first_visit||m.title||1;const mx=Math.max(1,...Object.values(m));
  const rows=STEPS.filter(([k])=>m[k]).map(([k,n])=>`<div><span class="dim" style="display:inline-block;width:112px">${n}</span><span class="bar" style="width:${Math.round(m[k]/mx*180)}px;background:#d9a64a"></span>${m[k]} 人 <span class="dim">(${Math.round(m[k]/base*100)}%)</span></div>`).join('');
  return rows||'<div class="dim">還沒有資料（新版上線後開始記錄）</div>';}
fetch(API).then(r=>r.json()).then(d=>{
  $('#gen').textContent='更新於 '+new Date(d.generated).toLocaleString('zh-TW',{hour12:false});const T=d.totals||{},F=d.firstRun||{},R=d.retention||{};
  const mx=Math.max(1,...(d.firstRunDeaths||[]).map(x=>x.n));
  $('#out').innerHTML=`
  <div class="k"><div>打開過遊戲<b>${T.players||0}</b></div><div>打完至少一局<b>${T.players_with_run||0}</b></div><div>總局數<b>${T.runs||0}</b></div><div>玩 2 局以上<b>${R.two_plus||0}</b></div><div>玩 5 局以上<b>${R.five_plus||0}</b></div><div>回饋<b>${T.feedback||0}</b></div></div>
  <h2>新手漏斗（每一步走到的人數）</h2>${funnel(d)}
  <h2>第一局（新手體驗）</h2><div class="k"><div>局數<b>${F.n||0}</b></div><div>平均存活<b>${fmt(F.avg_t)}</b></div><div>死亡<b>${F.deaths||0}</b></div><div>回城<b>${F.tps||0}</b></div><div>通關<b>${F.wins||0}</b></div></div>
  <div style="margin-top:8px">${(d.firstRunDeaths||[]).map(x=>`<div><span class="dim" style="display:inline-block;width:64px">${x.minute}–${x.minute+1} 分</span><span class="bar" style="width:${Math.round(x.n/mx*200)}px"></span>${x.n}</div>`).join('')||'<div class="dim">還沒有第一局死亡資料</div>'}</div>
  <h2>死因</h2>${tbl(d.killers,[['死因',r=>r.killer||'？'],['次數',r=>r.n],['平均時間',r=>fmt(r.avg_t)]])}
  <h2>職業</h2>${tbl(d.byClass,[['職業',r=>CLS[r.cls]||r.cls],['局數',r=>r.n],['通關',r=>r.wins||0],['死亡',r=>r.deaths||0],['平均時間',r=>fmt(r.avg_t)]])}
  <h2>地圖 × 煉獄</h2>${tbl(d.byMapTor,[['地圖',r=>MAP[r.map]||r.map],['煉獄',r=>r.tor],['局數',r=>r.n],['死亡',r=>r.deaths||0],['通關',r=>r.wins||0],['平均時間',r=>fmt(r.avg_t)]])}
  <h2>每天（14 天）</h2>${tbl(d.byDay,[['日期',r=>r.d],['玩家',r=>r.players],['局數',r=>r.runs],['死亡',r=>r.deaths||0]])}
  <h2>裝置與來源</h2>${tbl(d.byDevice,[['裝置',r=>r.device],['玩家',r=>r.players],['開啟次數',r=>r.sessions]])}${tbl(d.byPlatform,[['網址',r=>r.platform],['玩家',r=>r.players],['局數',r=>r.runs]])}${tbl(d.byCountry,[['國家',r=>r.country||'？'],['玩家',r=>r.players]])}
  <h2>玩家回饋</h2>${(d.recentFeedback||[]).map(f=>`<div class="fb">${esc(f.text)}<div class="dim">${dt(f.ts)} · ${CLS[f.cls]||f.cls||''} · ${MAP[f.map]||f.map||''} ${fmt(f.t)} · ${esc(f.ver)}</div></div>`).join('')||'<div class="dim">還沒有回饋</div>'}
  <h2>最近 40 局</h2>${tbl(d.recentRuns,[['時間',r=>dt(r.ts)],['地圖',r=>(MAP[r.map]||r.map)+' '+r.tor],['職業',r=>CLS[r.cls]||r.cls],['結果',r=>KIND[r.kind]||r.kind],['存活',r=>fmt(r.t)],['Lv',r=>r.lv],['殺',r=>r.kills],['黃/橘',r=>r.yellow+'/'+r.leg],['死因',r=>r.killer||''],['第幾局',r=>r.runs],['裝置',r=>r.device+' '+r.platform],['版本',r=>r.ver]])}`;
}).catch(e=>{$('#err').textContent='讀不到統計：'+e;});
</script></body></html>
